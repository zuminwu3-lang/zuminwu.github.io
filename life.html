function escapeHtml(text){

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;
}


function formatBytes(bytes){
    if(!Number.isFinite(bytes) || bytes <= 0)
        return "0 KB";

    const units = ["B","KB","MB","GB"];
    const i = Math.min(
        Math.floor(Math.log(bytes) / Math.log(1024)),
        units.length - 1
    );

    const value = bytes / Math.pow(1024, i);
    return `${value.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}


function setProgress(percent, text){
    const value = Math.max(0, Math.min(100, Math.round(percent)));
    uploadProgress.classList.add("show");
    progressBar.style.width = value + "%";
    progressPercent.textContent = value + "%";
    progressText.textContent = text || "上传中…";
}


function resetProgress(){
    uploadProgress.classList.remove("show");
    progressBar.style.width = "0%";
    progressPercent.textContent = "0%";
    progressText.textContent = "准备上传…";
}


function canCompressImage(file){
    return [
        "image/jpeg",
        "image/png",
        "image/webp"
    ].includes(file.type);
}


async function compressImage(file){
    if(!canCompressImage(file))
        return file;

    return new Promise((resolve) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
            try{
                const MAX_EDGE = 1920;
                const scale = Math.min(
                    1,
                    MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight)
                );

                // 小图并且本身已经很轻，不额外重编码。
                if(scale === 1 && file.size <= 1024 * 1024){
                    URL.revokeObjectURL(objectUrl);
                    resolve(file);
                    return;
                }

                const canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const quality = file.type === "image/png" ? undefined : 0.82;

                canvas.toBlob(
                    (blob) => {
                        URL.revokeObjectURL(objectUrl);

                        if(!blob || blob.size >= file.size){
                            resolve(file);
                            return;
                        }

                        resolve(new File(
                            [blob],
                            file.name,
                            {
                                type:file.type,
                                lastModified:file.lastModified
                            }
                        ));
                    },
                    file.type,
                    quality
                );
            }
            catch(error){
                console.warn("图片压缩失败，改用原图：", error);
                URL.revokeObjectURL(objectUrl);
                resolve(file);
            }
        };

        img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            resolve(file);
        };

        img.src = objectUrl;
    });
}


function renderSelectedFiles(){
    if(preparedFiles.length === 0){
        selectedFiles.innerHTML = "";
        return;
    }

    selectedFiles.innerHTML = preparedFiles
    .map(({ original, upload }) => {
        const compressed = upload.size < original.size;
        const sizeText = compressed
            ? `${formatBytes(original.size)} → ${formatBytes(upload.size)}`
            : formatBytes(original.size);

        const savedText = compressed
            ? `（节省 ${Math.round((1 - upload.size / original.size) * 100)}%）`
            : "";

        return `
        <div class="file-item">
            <span class="file-item-name">📎 ${escapeHtml(original.name)}</span>
            <span class="file-item-size ${compressed ? "saved" : ""}">
                ${sizeText}${savedText}
            </span>
        </div>`;
    })
    .join("");
}


fileInput.addEventListener(
"change",
async () => {
    const files = Array.from(fileInput.files);
    preparedFiles = [];
    resetProgress();

    if(files.length === 0){
        selectedFiles.innerHTML = "";
        return;
    }

    preparingFiles = true;
    publishBtn.disabled = true;
    publishBtn.textContent = "正在处理图片…";
    selectedFiles.innerHTML = "正在准备文件…";

    try{
        for(let i = 0; i < files.length; i++){
            const original = files[i];
            const upload = await compressImage(original);
            preparedFiles.push({ original, upload });
            renderSelectedFiles();
        }
    }
    finally{
        preparingFiles = false;
        publishBtn.disabled = false;
        publishBtn.textContent = "＋ 发布日常";
    }
}
);


function isImage(type){

    return type &&
           type.startsWith("image/");

}


async function loadMoments(){

    try{

        const {
            data,
            error
        } =
        await sbClient
        .from("moments")
        .select("*")
        .order(
            "id",
            {
                ascending:false
            }
        );

        if(error)
            throw error;

        moments =
        data || [];

        statusText.textContent =
        "✅ 已连接";

        renderMoments();

    }

    catch(error){

        console.error(error);

        statusText.textContent =
        "❌ 连接失败";

        momentList.innerHTML =
        `
        <div class="empty">
        加载失败
        <br><br>
        ${escapeHtml(error.message)}
        </div>
        `;

    }

}


function renderMoments(){

    if(moments.length === 0){

        momentList.innerHTML =
        `
        <div class="empty">
        📷
        <br><br>
        还没有日常。
        </div>
        `;

        return;

    }


    let html = "";


    for(const moment of moments){

        const date =
        moment.created_at
        ?
        new Date(moment.created_at)
        :
        new Date();

        const dateText =
        date.toLocaleString(
            "zh-CN",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


        let fileHtml = "";


        if(moment.file_url){

            if(isImage(moment.file_type)){

                fileHtml =
                `
                <img
                    src="${escapeHtml(moment.file_url)}"
                    alt=""
                >
                `;

            }

            else{

                fileHtml =
                `
                <div class="file-card">

                    <div class="file-name">
                    📎 ${escapeHtml(
                        moment.file_name || "文件"
                    )}
                    </div>

                    <a
                        class="file-link"
                        href="${escapeHtml(moment.file_url)}"
                        target="_blank">

                        打开 / 下载

                    </a>

                </div>
                `;

            }

        }


        html +=
        `
        <div class="card">

            ${fileHtml}

            ${
                moment.content
                ?
                `
                <div class="content">
                ${escapeHtml(moment.content)}
                </div>
                `
                :
                ""
            }

            <div class="footer">

                <div class="date">
                ${dateText}
                </div>

                <div class="actions">

                    <button
                    onclick="editMoment(${moment.id})">
                    编辑
                    </button>

                    <button
                    class="delete"
                    onclick="deleteMoment(${moment.id})">
                    删除
                    </button>

                </div>

            </div>

        </div>
        `;

    }


    momentList.innerHTML =
    html;

}


async function uploadFile(file){

    const extension =
    file.name.includes(".")
    ?
    "." + file.name.split(".").pop()
    :
    "";


    const filePath =
    Date.now()
    +
    "-"
    +
    crypto.randomUUID()
    +
    extension;


    const {
        error
    } =
    await sbClient
    .storage
    .from("moments")
    .upload(
        filePath,
        file,
        {
            cacheControl:"3600",
            upsert:false
        }
    );


    if(error)
        throw error;


    const {
        data
    } =
    sbClient
    .storage
    .from("moments")
    .getPublicUrl(
        filePath
    );


    return {

        url:data.publicUrl,

        path:filePath

    };

}


async function publishMoment(){

    if(preparingFiles){
        alert("图片还在处理中，请稍等一下");
        return;
    }

    const content =
    contentInput.value.trim();

    const files =
    preparedFiles.length > 0
    ? preparedFiles
    : Array.from(fileInput.files).map(file => ({ original:file, upload:file }));


    if(
        !content &&
        files.length === 0
    ){

        alert(
            "请输入文字或选择文件"
        );

        return;

    }


    publishBtn.disabled =
    true;

    setProgress(0, "准备发布…");


    try{


        if(files.length === 0){

            const {
                error
            } =
            await sbClient
            .from("moments")
            .insert([
                {
                    content:content
                }
            ]);


            if(error)
                throw error;

            setProgress(100, "发布完成");

        }

        else{


            for(
                let i = 0;
                i < files.length;
                i++
            ){

                const item = files[i];
                const file = item.upload;
                const original = item.original;

                const base = (i / files.length) * 100;
                const afterUpload = ((i + 0.8) / files.length) * 100;
                const done = ((i + 1) / files.length) * 100;

                setProgress(
                    base,
                    `上传 ${i + 1}/${files.length}：${original.name}`
                );

                publishBtn.textContent =
                `上传中 ${i + 1}/${files.length}`;


                const uploaded =
                await uploadFile(file);

                setProgress(
                    afterUpload,
                    `正在保存 ${i + 1}/${files.length}…`
                );


                const {
                    error
                } =
                await sbClient
                .from("moments")
                .insert([
                    {

                        content:
                        i === 0
                        ?
                        content
                        :
                        "",

                        file_url:
                        uploaded.url,

                        file_path:
                        uploaded.path,

                        file_name:
                        original.name,

                        file_type:
                        file.type || original.type

                    }
                ]);


                if(error){
                    // 数据库写入失败时，尽量清掉已经上传的孤立文件。
                    await sbClient
                    .storage
                    .from("moments")
                    .remove([uploaded.path]);

                    throw error;
                }

                setProgress(done, `已完成 ${i + 1}/${files.length}`);

            }

        }


        contentInput.value = "";

        fileInput.value = "";

        preparedFiles = [];

        selectedFiles.innerHTML = "";


        await loadMoments();

        setProgress(100, "发布完成 ✓");
        setTimeout(resetProgress, 1600);

    }

    catch(error){

        console.error(error);

        setProgress(0, "发布失败");

        alert(
            "发布失败：\n"
            +
            error.message
        );

    }

    finally{

        publishBtn.disabled =
        false;

        publishBtn.textContent =
        "＋ 发布日常";

    }

}


let editingMomentId=null;
const editModal=document.getElementById("editModal");
const editContentInput=document.getElementById("editContentInput");
const cancelEditBtn=document.getElementById("cancelEditBtn");
const saveEditBtn=document.getElementById("saveEditBtn");

window.editMoment=function(id){
    const moment=moments.find(item=>item.id===id);
    if(!moment)return;
    editingMomentId=id;
    editContentInput.value=moment.content||"";
    editModal.classList.add("show");
    setTimeout(()=>{editContentInput.focus();editContentInput.setSelectionRange(editContentInput.value.length,editContentInput.value.length)},0);
};
function closeEditModal(){editingMomentId=null;editModal.classList.remove("show")}
cancelEditBtn.addEventListener("click",closeEditModal);
editModal.addEventListener("click",e=>{if(e.target===editModal)closeEditModal()});
saveEditBtn.addEventListener("click",async()=>{
    if(editingMomentId===null)return;
    const newContent=editContentInput.value;
    saveEditBtn.disabled=true;saveEditBtn.textContent="保存中...";
    try{
        const {error}=await sbClient.from("moments").update({content:newContent}).eq("id",editingMomentId);
        if(error)throw error;
        closeEditModal();
        await loadMoments();
    }catch(error){console.error(error);alert("修改失败：\n"+error.message)}
    finally{saveEditBtn.disabled=false;saveEditBtn.textContent="保存修改"}
});


window.deleteMoment =
async function(id){

    const moment =
    moments.find(
        item =>
        item.id === id
    );


    if(!moment)
        return;


    if(
        !confirm(
            "确定删除这条日常吗？"
        )
    )
        return;


    try{


        if(moment.file_path){

            const {
                error
            } =
            await sbClient
            .storage
            .from("moments")
            .remove([
                moment.file_path
            ]);


            if(error)
                throw error;

        }


        const {
            error
        } =
        await sbClient
        .from("moments")
        .delete()
        .eq(
            "id",
            id
        );


        if(error)
            throw error;


        await loadMoments();

    }

    catch(error){

        console.error(error);

        alert(
            "删除失败：\n"
            +
            error.message
        );

    }

};


publishBtn.addEventListener(
    "click",
    publishMoment
);


// 登录成功后再加载日常。

</script>

(function(){
  const gate=document.getElementById("lifeLoginGate");
  const app=document.getElementById("lifeApp");
  const input=document.getElementById("lifePassword");
  const btn=document.getElementById("lifeLoginBtn");
  const err=document.getElementById("lifeLoginError");
  const logout=document.getElementById("lifeLogoutBtn");
  const SESSION_KEY="zumin_life_unlocked";

  function openLife(){
    gate.style.display="none";
    app.style.display="block";
    sessionStorage.setItem(SESSION_KEY,"1");
    if(typeof loadMoments==="function") loadMoments();
  }

  async function login(){
    const password=input.value;
    if(!password){err.textContent="请输入密码。";input.focus();return;}
    btn.disabled=true; btn.textContent="验证中…"; err.textContent="";
    try{
      const {data,error}=await sbClient.rpc("verify_life_password",{p_password:password});
      if(error) throw error;
      if(data===true){
        input.value="";
        openLife();
      }else{
        err.textContent="密码错误。";
        input.select();
      }
    }catch(e){
      console.error(e);
      err.textContent="验证失败："+(e.message||"未知错误");
    }finally{
      btn.disabled=false; btn.textContent="进入";
    }
  }

  btn.addEventListener("click",login);
  input.addEventListener("keydown",e=>{if(e.key==="Enter")login();});
  logout.addEventListener("click",()=>{
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  });

  if(sessionStorage.getItem(SESSION_KEY)==="1") openLife();
  else setTimeout(()=>input.focus(),0);
})();
</script>
</body>

</html>

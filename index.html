<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZUMIN · 简单日记</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 24px;
            font-family: -apple-system, 'Microsoft YaHei', sans-serif;
            background-color: #fafaf8;
            color: #1e1e1e;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 40px 36px 44px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 44px;
            font-weight: 550;
            margin-bottom: 4px;
            color: #141414;
        }

        .subhead {
            color: #7a7a7a;
            font-size: 16px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-badge {
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #5a5a5a;
            background: #e8e8e4;
        }

        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .entry-area {
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid #ecece8;
        }

        .entry-area textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px 16px;
            border: 1px solid #e0e0dc;
            border-radius: 18px;
            font-size: 16px;
            font-family: inherit;
            background: #fcfcfa;
            transition: border 0.2s;
            resize: vertical;
        }

        .entry-area textarea:focus {
            outline: none;
            border-color: #b0b0a8;
        }

        .entry-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }

        .entry-actions button {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 450;
            background: #1e1e1e;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .entry-actions button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .entry-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .diary-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 24px;
            border: 1px solid #ecece8;
            transition: all 0.15s;
        }

        .diary-item:hover {
            border-color: #d8d8d2;
        }

        .diary-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .diary-date {
            font-size: 14px;
            font-weight: 450;
            color: #4a4a4a;
        }

        .diary-actions button {
            background: transparent;
            border: none;
            color: #9a9a94;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.15s;
            font-family: inherit;
            font-size: 14px;
        }

        .diary-actions button:hover {
            color: #c0392b;
            background: #fde8e5;
        }

        .diary-content {
            font-size: 16px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.7;
        }

        .diary-checkbox {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .diary-item.completed .diary-content {
            text-decoration: line-through;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #b0b0aa;
            background: #f8f8f5;
            border-radius: 24px;
            border: 1px dashed #d8d8d2;
        }

        .empty-state span {
            font-size: 28px;
            display: block;
            margin-bottom: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7a7a7a;
        }

        @media (max-width: 520px) {
            body {
                margin: 30px auto;
                padding: 0 16px;
            }
            .container {
                padding: 28px 18px 32px;
            }
            h1 {
                font-size: 36px;
            }
            .entry-area {
                padding: 16px;
            }
            .diary-item {
                padding: 16px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📖 ZUMIN</h1>
        <div class="subhead">
            <span>☁️ 简单日记 · 使用 todos 表</span>
            <span class="status-badge" id="statusBadge">连接中...</span>
        </div>

        <div class="entry-area">
            <textarea id="diaryInput" placeholder="今天发生了什么？写下来吧 …" rows="3"></textarea>
            <div class="entry-actions">
                <button id="saveBtn">✧ 发布日记</button>
            </div>
        </div>

        <div id="diaryList" class="diary-list">
            <div class="loading">⏳ 加载中...</div>
        </div>

    </div>

    <script>
        // ============================================================
        // ✅ 已配置好，无需修改
        // ============================================================
        const SUPABASE_URL = 'https://kgmhpsoiqnjszkrknqki.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_JWBaBcQORvM6wsqoA7ivzQ_GhCA3hv1';
        // ============================================================

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const diaryList = document.getElementById('diaryList');
        const diaryInput = document.getElementById('diaryInput');
        const saveBtn = document.getElementById('saveBtn');
        const statusBadge = document.getElementById('statusBadge');

        let entries = [];

        function setStatus(online) {
            statusBadge.textContent = online ? '✅ 在线' : '❌ 离线';
            statusBadge.className = 'status-badge ' + (online ? 'online' : 'offline');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- 加载数据（使用 todos 表）----------
        async function loadEntries() {
            try {
                const { data, error } = await supabase
                    .from('todos')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                entries = data || [];
                setStatus(true);
                renderEntries();
            } catch (err) {
                console.error('加载失败:', err);
                setStatus(false);
                diaryList.innerHTML = `
                    <div class="empty-state">
                        <span>⚠️</span>
                        加载失败: ${err.message}<br>
                        <small style="color:#999;">请检查 Supabase 配置</small>
                    </div>
                `;
            }
        }

        // ---------- 渲染 ----------
        function renderEntries() {
            if (entries.length === 0) {
                diaryList.innerHTML = `
                    <div class="empty-state">
                        <span>📭</span>
                        还没有日记，写一篇吧 ✍️
                    </div>
                `;
                return;
            }

            let html = '';
            for (const entry of entries) {
                const date = entry.inserted_at ? new Date(entry.inserted_at) : new Date();
                const dateStr = date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const content = escapeHtml(entry.task || entry.content || '');
                const isCompleted = entry.is_complete || false;

                html += `
                    <div class="diary-item ${isCompleted ? 'completed' : ''}" data-id="${entry.id}">
                        <div class="diary-header">
                            <div class="diary-date">
                                <input type="checkbox" class="diary-checkbox" 
                                       ${isCompleted ? 'checked' : ''} 
                                       onchange="toggleComplete(${entry.id}, this.checked)" />
                                📅 ${dateStr}
                            </div>
                            <div class="diary-actions">
                                <button onclick="deleteEntry(${entry.id})" title="删除">✕</button>
                            </div>
                        </div>
                        <div class="diary-content">${content}</div>
                    </div>
                `;
            }

            diaryList.innerHTML = html;
        }

        // ---------- 新增日记 ----------
        async function addEntry(content) {
            if (!content || content.trim() === '') {
                alert('请写点内容～');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ 发布中...';

            try {
                const { data, error } = await supabase
                    .from('todos')
                    .insert([{
                        task: content.trim(),
                        is_complete: false
                    }])
                    .select();

                if (error) throw error;

                diaryInput.value = '';
                await loadEntries();
                setStatus(true);
            } catch (err) {
                console.error('发布失败:', err);
                setStatus(false);
                alert('发布失败: ' + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '✧ 发布日记';
            }
        }

        // ---------- 切换完成状态 ----------
        window.toggleComplete = async function(id, checked) {
            try {
                const { error } = await supabase
                    .from('todos')
                    .update({ is_complete: checked })
                    .eq('id', id);

                if (error) throw error;
                await loadEntries();
            } catch (err) {
                console.error('更新失败:', err);
                alert('更新失败: ' + err.message);
            }
        };

        // ---------- 删除 ----------
        window.deleteEntry = async function(id) {
            if (!confirm('确定删除吗？')) return;

            try {
                const { error } = await supabase
                    .from('todos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                await loadEntries();
            } catch (err) {
                console.error('删除失败:', err);
                alert('删除失败: ' + err.message);
            }
        };

        // ---------- 事件绑定 ----------
        saveBtn.addEventListener('click', () => {
            addEntry(diaryInput.value);
        });

        // Ctrl+Enter 快速保存
        diaryInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                saveBtn.click();
            }
        });

        // ---------- 启动 ----------
        loadEntries();
        diaryInput.focus();

        console.log('📖 ZUMIN 简单日记已启动');
        console.log('🔗 Supabase:', SUPABASE_URL);
        console.log('📋 使用 todos 表');
    </script>

</body>

</html>

body{

.avatar{

    color:white;

    opacity:0;

h1{

.subtitle{

    line-height:1.8;

.status{

/* =========================
   卡片
========================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}


.card{

    display:block;

    position:relative;

    min-height:180px;

    padding:26px;

    background:white;

    border:1px solid #ecece8;

    border-radius:24px;

    text-decoration:none;

    color:#222;

    transition:
        transform .2s,
        box-shadow .2s;
}


.card:hover{

    transform:
        translateY(-4px);

    box-shadow:
        0 12px 32px
        rgba(0,0,0,.06);
}


.number{

    color:#aaa;

    font-size:13px;

    margin-bottom:35px;
}


.card h2{

    font-size:26px;

    margin-bottom:10px;
}


.card p{

    color:#888;

    line-height:1.7;

    font-size:14px;
}


.arrow{

    position:absolute;

    right:24px;

    bottom:22px;

    color:#aaa;

    font-size:22px;
}


/* =========================
   GitHub 特殊一点
========================= */

.github{

    grid-column:
        span 2;
}


.github h2{

    font-size:30px;
}


/* =========================
   footer
========================= */

footer{

    margin-top:70px;

    text-align:center;

    color:#aaa;

    font-size:13px;

/* =========================
   手机
========================= */

            1fr;

    }


    .github{

        grid-column:
            span 1;

    }


    .card{

        min-height:160px;

    }

}

<script>


/* =========================================
   Supabase
========================================= */


const SUPABASE_URL =
"https://kgmhpsoiqnjszkrknqki.supabase.co";


const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnbWhwc29pcW5qc3prcmtucWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI0MjQsImV4cCI6MjEwNDE2ODQyNH0.fWz688zm6UwQBXjVtx_qSrrTkRJZ_mgh-tuBaRJY73s";


const sbClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



/* =========================================
   网站头像
========================================= */


const siteAvatar =
document.getElementById(
    "siteAvatar"
);


const avatarInput =
document.getElementById(
    "avatarInput"
);


const avatarStatus =
document.getElementById(
    "avatarStatus"
);


siteAvatar.addEventListener(
    "error",
    () => {

        console.warn(
            "头像图片加载失败，使用默认头像"
        );

        setDefaultAvatar();

    }
);



/* 默认头像 */

function setDefaultAvatar(){

    siteAvatar.src =
    "data:image/svg+xml;charset=UTF-8,"
    +
    encodeURIComponent(`
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="300"
            height="300"
            viewBox="0 0 300 300">

            <rect
                width="300"
                height="300"
                fill="#eeeeea"
            />

            <text
                x="150"
                y="175"
                text-anchor="middle"
                font-size="90"
                font-family="Arial"
                fill="#888888">
                Z
            </text>

        </svg>
    `);

}



/* =========================================
   读取网站头像
========================================= */


async function loadSiteAvatar(){

    setDefaultAvatar();

    try{

        const {
            data,
            error
        } =
        await sbClient
        .from("site_settings")
        .select("value")
        .eq(
            "key",
            "site_avatar"
        )
        .maybeSingle();

        if(error)
            throw error;

        if(
            data &&
            data.value
        ){

            let imageUrl = data.value;

            /* 新版本保存的是 Storage 文件路径；
               旧版本如果保存的是完整 URL，也继续兼容。 */
            if(
                !/^https?:\/\//i.test(
                    imageUrl
                )
            ){

                const {
                    data:urlData
                } =
                sbClient
                .storage
                .from("moments")
                .getPublicUrl(
                    imageUrl
                );

                imageUrl =
                urlData.publicUrl;

            }

            /* 防止浏览器缓存旧头像 */
            const separator =
                imageUrl.includes("?")
                ? "&"
                : "?";

            siteAvatar.src =
                imageUrl
                +
                separator
                +
                "v="
                +
                Date.now();

        }

    }

    catch(error){

        console.error(
            "头像读取失败：",
            error
        );

        avatarStatus.textContent =
        "头像暂时无法读取";

    }

}



/* =========================================
   上传头像
========================================= */


avatarInput.addEventListener(
"change",
async () => {


    const file =
    avatarInput.files[0];


    if(!file)
        return;


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "请选择图片文件"
        );

        return;
    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        alert(
            "图片不能超过 5MB"
        );

        return;
    }


    avatarStatus.textContent =
    "正在上传...";


    /* 选择后先本地预览，不用等待网络 */
    const localPreviewUrl =
    URL.createObjectURL(
        file
    );

    siteAvatar.src =
    localPreviewUrl;


    try{

        const extension =
        file.name.includes(".")
        ?
        file.name
        .split(".")
        .pop()
        .toLowerCase()
        :
        "png";


        const filePath =
        "profile/site-avatar-"
        +
        Date.now()
        +
        "."
        +
        extension;


        const {
            error:
            uploadError
        } =
        await sbClient
        .storage
        .from("moments")
        .upload(
            filePath,
            file,
            {
                cacheControl:
                "3600",

                upsert:false
            }
        );


        if(uploadError)
            throw uploadError;


        /* 数据库只保存 Storage 路径，不再保存完整网址 */
        const {
            error:
            settingError
        } =
        await sbClient
        .from("site_settings")
        .upsert(
            {

                key:
                "site_avatar",

                value:
                filePath,

                updated_at:
                new Date()
                .toISOString()

            },

            {

                onConflict:
                "key"

            }
        );


        if(settingError)
            throw settingError;


        /* 上传完成后重新从 Storage 生成正确公开地址 */
        const {
            data:urlData
        } =
        sbClient
        .storage
        .from("moments")
        .getPublicUrl(
            filePath
        );


        siteAvatar.src =
        urlData.publicUrl
        +
        "?v="
        +
        Date.now();


        avatarStatus.textContent =
        "✓ 图标已更新";


        setTimeout(
            () => {

                avatarStatus.textContent =
                "";

            },
            2500
        );


    }

    catch(error){

        console.error(
            error
        );

        avatarStatus.textContent =
        "";

        alert(
            "图标上传失败：
"
            +
            error.message
        );

        /* 上传失败时恢复服务器里原来的头像 */
        await loadSiteAvatar();

    }

    finally{

        URL.revokeObjectURL(
            localPreviewUrl
        );

        avatarInput.value =
        "";

    }

});



/* =========================================
   页面启动
========================================= */


loadSiteAvatar();


</script>

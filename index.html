<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZUMIN</title>



<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    max-width:1000px;

    margin:0 auto;

    padding:70px 24px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    background:#fafaf8;

    color:#222;
}


/* =========================
   顶部
========================= */

.hero{

    text-align:center;

    margin-bottom:60px;
}


.avatar-box{

    display:flex;

    justify-content:center;

    margin-bottom:24px;
}


.avatar-label{

    cursor:pointer;
}


.avatar-wrapper{

    width:130px;

    height:130px;

    border-radius:50%;

    position:relative;

    overflow:hidden;

    background:#eeeeea;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);
}


.avatar{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


.avatar-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(0,0,0,.42);

    color:white;

    font-size:14px;

    opacity:0;

    transition:.2s;
}


.avatar-wrapper:hover
.avatar-overlay{

    opacity:1;
}


h1{

    font-size:58px;

    letter-spacing:4px;

    margin-bottom:14px;
}


.subtitle{

    color:#888;

    font-size:17px;

    line-height:1.8;
}


.status{

    margin-top:10px;

    color:#aaa;

    font-size:12px;
}


/* =========================
   卡片
========================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}


.card{

    display:block;

    position:relative;

    min-height:180px;

    padding:26px;

    background:white;

    border:1px solid #ecece8;

    border-radius:24px;

    text-decoration:none;

    color:#222;

    transition:
        transform .2s,
        box-shadow .2s;
}


.card:hover{

    transform:
        translateY(-4px);

    box-shadow:
        0 12px 32px
        rgba(0,0,0,.06);
}


.number{

    color:#aaa;

    font-size:13px;

    margin-bottom:35px;
}


.card h2{

    font-size:26px;

    margin-bottom:10px;
}


.card p{

    color:#888;

    line-height:1.7;

    font-size:14px;
}


.arrow{

    position:absolute;

    right:24px;

    bottom:22px;

    color:#aaa;

    font-size:22px;
}


/* =========================
   GitHub 特殊一点
========================= */

.github{

    grid-column:
        span 2;
}


.github h2{

    font-size:30px;
}


/* =========================
   footer
========================= */

footer{

    margin-top:70px;

    text-align:center;

    color:#aaa;

    font-size:13px;
}


/* =========================
   手机
========================= */

@media(max-width:700px){

    body{

        padding:
            45px
            16px;

    }


    h1{

        font-size:44px;

    }


    .avatar-wrapper{

        width:110px;

        height:110px;

    }


    .grid{

        grid-template-columns:
            1fr;

    }


    .github{

        grid-column:
            span 1;

    }


    .card{

        min-height:160px;

    }

}

</style>

</head>

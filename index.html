<title>ZUMIN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:#fafaf8;
    color:#1e1e1e;
}

.container{
    max-width:1000px;
    margin:70px auto;
    padding:0 24px;
}

header{
    margin-bottom:55px;
}

h1{
    font-size:56px;
    font-weight:600;
    margin-bottom:12px;
}

.subtitle{
    color:#777;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:white;
    border:1px solid #ecece8;
    border-radius:28px;
    padding:30px;
    min-height:180px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.number{
    color:#aaa;
    font-size:13px;
    margin-bottom:38px;
}

.title{
    font-size:28px;
    margin-bottom:10px;
}

.desc{
    color:#777;
    line-height:1.6;
}

.footer{
    margin-top:50px;
    color:#aaa;
    font-size:14px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    h1{
        font-size:44px;
    }
}
</style>
</head>

<body>

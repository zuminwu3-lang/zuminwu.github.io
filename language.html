<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>语言学习 · ZUMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#fafaf8;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.container{width:min(1050px,calc(100% - 32px));margin:0 auto;padding:42px 0 80px}
a{color:inherit;text-decoration:none}.back{display:inline-block;margin-bottom:34px;color:#777;font-size:14px}
h1{margin:0;font-size:54px;letter-spacing:-2px}.subtitle{margin-top:10px;color:#8b8b84;font-size:15px}.status{margin-top:10px;color:#8b8b84;font-size:13px}
.panel,.entry{background:#fff;border:1px solid #ecece7;border-radius:24px;box-shadow:0 10px 35px rgba(0,0,0,.035)}
.panel{margin-top:34px;padding:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:16px}label{display:block;font-size:13px;color:#777;margin-bottom:7px}
input,textarea{width:100%;border:1px solid #deded8;border-radius:14px;background:#fbfbf9;padding:12px 14px;font:inherit;color:#222;outline:none}
textarea{min-height:180px;resize:vertical;line-height:1.75}input:focus,textarea:focus{border-color:#999;background:#fff}
.record-card{margin-top:18px;border:1px solid #e8e8e2;border-radius:18px;padding:18px;background:#f8f8f5}
.record-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.record-title{font-weight:650}.timer{font-variant-numeric:tabular-nums;color:#777;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{border:0;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer;transition:.18s ease}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:#222;color:#fff}.secondary{background:#ecece7;color:#444}.danger{background:#f8eaea;color:#a04444}
.recording{background:#c94d4d!important;color:#fff!important}audio{width:100%;margin-top:14px}.audio-meta{margin-top:8px;font-size:13px;color:#888}
.tip{margin-top:10px;font-size:12px;color:#999;line-height:1.6}.save-row{margin-top:20px;display:flex;justify-content:flex-end}
.history{margin-top:42px}.history h2{font-size:26px;margin-bottom:16px}.entries{display:grid;gap:14px}.entry{padding:20px}
.entry-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.entry-title{font-weight:700;font-size:18px}.entry-date{color:#999;font-size:13px}
.entry-content{margin-top:12px;white-space:pre-wrap;line-height:1.75}.entry audio{margin-top:14px}.audio-info{margin-top:7px;color:#999;font-size:12px}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.empty{color:#999;padding:30px;text-align:center;border:1px dashed #ddd;border-radius:18px}
.uploading{margin-top:10px;color:#777;font-size:13px;display:none}
@media(max-width:750px){h1{font-size:42px}.grid2{grid-template-columns:1fr}.container{width:min(100% - 22px,1050px);padding-top:28px}.panel{padding:18px}}

.dictation-card{margin-top:18px;border:1px solid #e8e8e2;border-radius:18px;padding:18px;background:#f8f8f5}
.dictation-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.word-preview{margin-top:12px;padding:12px;background:#fff;border:1px solid #e6e6e0;border-radius:14px;max-height:160px;overflow:auto;display:none;line-height:1.8;font-size:13px;color:#666}
.dictation-area{margin-top:16px;padding:18px;background:#fff;border:1px solid #e6e6e0;border-radius:16px;display:none}
.dictation-progress{display:flex;justify-content:space-between;color:#777;font-size:13px;margin-bottom:12px}
.dictation-input{font-size:20px;text-align:center}
.dictation-feedback{text-align:center;min-height:25px;margin-top:12px;font-weight:650}
.dictation-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat-box{background:#f7f7f4;border-radius:12px;padding:10px;text-align:center}.stat-box b{display:block;font-size:18px}.stat-box span{font-size:11px;color:#888}
.wrong-list{margin-top:12px;color:#777;font-size:13px;line-height:1.7}
@media(max-width:600px){.dictation-stats{grid-template-columns:1fr 1fr}}

.article-reader{margin-top:10px;padding:14px;border:1px solid #e8e8e2;border-radius:16px;background:#f8f8f5}
.reader-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reader-controls select{border:1px solid #deded8;border-radius:999px;background:#fff;padding:9px 12px;color:#444}
.reader-status{margin-top:8px;font-size:12px;color:#888}
.reading-active{background:#222!important;color:#fff!important}

.vocab-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:9999;padding:28px}
.vocab-panel{max-width:900px;height:min(82vh,760px);margin:auto;background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.2)}
.vocab-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vocab-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.vocab-tools input{flex:1;min-width:180px}
.vocab-list{overflow:auto;border-top:1px solid #eee}
.vocab-row{display:grid;grid-template-columns:56px 1fr 1.5fr 100px;gap:12px;padding:11px 4px;border-bottom:1px solid #eee;align-items:start}
.vocab-word{font-weight:700}
.vocab-meta{font-size:12px;color:#888}
@media(max-width:650px){.vocab-modal{padding:10px}.vocab-row{grid-template-columns:38px 1fr}.vocab-meaning{grid-column:2}.vocab-meta{grid-column:2}}
</style>
</head>
<body>
<div class="container">
<a class="back" href="index.html">← 返回首页</a>

<h1>语言学习</h1>
<div class="subtitle">记录词汇、表达、口语与每天一点点进步。</div>
<div id="status" class="status">连接中...</div>

<div class="panel">
  <div class="grid2">
    <div class="field">
      <label for="dateInput">日期</label>
      <input id="dateInput" type="date">
    </div>
    <div class="field">
      <label for="titleInput">标题</label>
      <input id="titleInput" type="text" placeholder="例如：Day 1 · Speaking Practice">
    </div>
  </div>

  <div class="field">
    <label for="contentInput">学习内容</label>
    <textarea id="contentInput" placeholder="今天背了哪些单词、学了哪些表达、阅读了什么……"></textarea>

    <div class="article-reader">
      <div class="reader-controls">
        <button id="readArticleBtn" class="primary" type="button">🔊 朗读文章</button>
        <button id="pauseArticleBtn" class="secondary" type="button" disabled>⏸ 暂停</button>
        <button id="resumeArticleBtn" class="secondary" type="button" disabled>▶ 继续</button>
        <button id="stopArticleBtn" class="secondary" type="button" disabled>■ 停止</button>

        <select id="articleAccent" title="朗读口音">
          <option value="en-US">美音</option>
          <option value="en-GB">英音</option>
        </select>

        <select id="articleRate" title="朗读速度">
          <option value="0.75">0.75×</option>
          <option value="0.9">0.9×</option>
          <option value="1" selected>1.0×</option>
          <option value="1.1">1.1×</option>
          <option value="1.25">1.25×</option>
        </select>
      </div>
      <div id="readerStatus" class="reader-status">把英文文章粘贴到“学习内容”，即可直接朗读。</div>
    </div>
  </div>


  <div class="dictation-card">
    <div class="dictation-head"><b>📚 总词库 · 每日听写</b><span id="wordCount" class="audio-meta">总词库 0</span></div>
    <div class="row">
      <input id="wordFileInput" type="file" accept=".txt,.csv,text/plain,text/csv" style="max-width:430px;background:#fff">
      <button id="uploadWordsBtn" class="primary" type="button">上传今日单词</button>
      <button id="refreshWordsBtn" class="secondary" type="button">刷新词库</button>
      <button id="viewVocabularyBtn" class="secondary" type="button">📚 查看总词库</button>
    </div>
    <div id="uploadWordStatus" class="tip">支持 TXT / CSV；每行推荐：derive, 推导；得到。重复单词自动更新，不重复计数。</div>
    <div class="row" style="margin-top:16px">
      <select id="questionType" style="border:1px solid #deded8;border-radius:14px;background:#fff;padding:10px 14px">
        <option value="audio">🔊 听音 → 写单词</option>
        <option value="meaning_word">🇨🇳 意思 → 写单词</option>
        <option value="word_meaning">🇬🇧 单词 → 写意思</option>
        <option value="mixed">🔀 随机混合</option>
      </select>
      <select id="dictationMode" style="border:1px solid #deded8;border-radius:14px;background:#fff;padding:10px 14px">
        <option value="today">今日单词</option>
        <option value="random">总词库随机</option>
        <option value="wrong">历史错词</option>
        <option value="smart">智能复习</option>
      </select>
      <input id="drawCount" type="number" min="1" value="50" style="width:110px">
      <button id="startDictationBtn" class="primary" type="button">开始测试</button>
    </div>
    <div id="dictationArea" class="dictation-area">
      <div class="dictation-progress"><span id="dictationProgress">0 / 0</span><span id="dictationScore">正确 0 · 错误 0</span></div>
      <div id="questionPrompt" style="text-align:center;font-size:24px;font-weight:700;line-height:1.6;min-height:46px;margin-bottom:10px"></div>
      <div id="audioQuestionBox" style="text-align:center"><button id="speakWordBtn" class="primary">🔊 播放单词</button></div>
      <input id="dictationInput" class="dictation-input" type="text" autocomplete="off" spellcheck="false" placeholder="输入答案，按 Enter 提交" style="margin-top:14px">
      <div id="dictationFeedback" class="dictation-feedback"></div>
      <div class="row" style="justify-content:center">
        <button id="replayBtn" class="secondary">重新播放</button><button id="showAnswerBtn" class="secondary">显示答案</button><button id="nextWordBtn" class="secondary">下一个</button>
      </div>
      <div class="dictation-stats">
        <div class="stat-box"><b id="statTotal">0</b><span>本次词数</span></div><div class="stat-box"><b id="statDone">0</b><span>已完成</span></div>
        <div class="stat-box"><b id="statCorrect">0</b><span>正确</span></div><div class="stat-box"><b id="statAccuracy">0%</b><span>正确率</span></div>
      </div><div id="wrongList" class="wrong-list"></div>
    </div>
  </div>

  <div class="record-card">
    <div class="record-head">
      <div class="record-title">🎙️ Speaking Practice</div>
      <div id="timer" class="timer">00:00</div>
    </div>

    <div class="row">
      <button id="startBtn" class="primary">● 开始录音</button>
      <button id="stopBtn" class="secondary" disabled>■ 停止</button>
      <button id="discardBtn" class="danger" disabled>删除本次录音</button>
    </div>

    <audio id="audioPlayer" controls style="display:none"></audio>
    <div id="audioMeta" class="audio-meta"></div>
    <div id="uploading" class="uploading">正在保存录音，请稍候…</div>

    <div class="tip">
      点击“保存今日记录”后，录音会上传并保存在你的 Supabase Storage 中。历史记录里的录音可以直接播放，也可以单独删除。
    </div>
  </div>

  <div class="save-row">
    <button id="saveBtn" class="primary">保存今日记录</button>
  </div>
</div>

<div class="history">
  <h2>历史记录</h2>
  <div id="entryList" class="entries"><div class="empty">加载中...</div></div>
</div>
</div>

<div id="vocabularyModal" class="vocab-modal">
  <div class="vocab-panel">
    <div class="vocab-head">
      <div>
        <h2 style="margin:0">总词库</h2>
        <div id="vocabularySummary" class="muted" style="margin-top:5px">正在读取…</div>
      </div>
      <button id="closeVocabularyBtn" class="secondary" type="button">✕ 关闭</button>
    </div>
    <div class="vocab-tools">
      <input id="vocabularySearch" type="text" placeholder="搜索单词或中文释义…">
      <button id="readVocabularyBtn" class="primary" type="button">▶ 连续朗读</button>
      <button id="stopVocabularyBtn" class="secondary" type="button" disabled>■ 停止朗读</button>
      <select id="vocabularySort" style="border:1px solid #deded8;border-radius:14px;background:#fff;padding:10px 14px">
        <option value="newest">最近添加</option>
        <option value="az">A → Z</option>
        <option value="wrong">错误最多</option>
        <option value="tested">测试最多</option>
      </select>
    </div>
    <div id="vocabularyList" class="vocab-list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://kgmhpsoiqnjszkrknqki.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnbWhwc29pcW5qc3prcmtucWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI0MjQsImV4cCI6MjEwNDE2ODQyNH0.fWz688zm6UwQBXjVtx_qSrrTkRJZ_mgh-tuBaRJY73s";
const AUDIO_BUCKET = "language-audio";

const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

const dateInput=$("dateInput"), titleInput=$("titleInput"), contentInput=$("contentInput");
const startBtn=$("startBtn"), stopBtn=$("stopBtn"), discardBtn=$("discardBtn"), saveBtn=$("saveBtn");
const timer=$("timer"), audioPlayer=$("audioPlayer"), audioMeta=$("audioMeta"), uploading=$("uploading");
const entryList=$("entryList"), statusText=$("status");

let mediaRecorder=null, stream=null, chunks=[], audioBlob=null, timerId=null, seconds=0;

function todayLocal(){
  const d=new Date();
  const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
dateInput.value=todayLocal();

function fmtTime(s){
  const m=Math.floor(s/60).toString().padStart(2,"0");
  const x=(s%60).toString().padStart(2,"0");
  return `${m}:${x}`;
}
function fmtBytes(bytes){
  if(bytes==null) return "";
  if(bytes<1024) return `${bytes} B`;
  if(bytes<1024*1024) return `${(bytes/1024).toFixed(1)} KB`;
  return `${(bytes/1024/1024).toFixed(2)} MB`;
}
function esc(v){
  const d=document.createElement("div");
  d.textContent=v||"";
  return d.innerHTML;
}
function mimeType(){
  const list=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
  return list.find(x=>MediaRecorder.isTypeSupported(x))||"";
}
function resetLocalAudio(){
  audioBlob=null; chunks=[]; seconds=0;
  timer.textContent="00:00";
  audioPlayer.pause();
  if(audioPlayer.src && audioPlayer.src.startsWith("blob:")) URL.revokeObjectURL(audioPlayer.src);
  audioPlayer.removeAttribute("src");
  audioPlayer.load();
  audioPlayer.style.display="none";
  audioMeta.textContent="";
  discardBtn.disabled=true;
}

startBtn.onclick=async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("当前浏览器不支持录音");
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const m=mimeType();
    mediaRecorder=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream);
    chunks=[];
    resetLocalAudio();

    mediaRecorder.ondataavailable=e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop=()=>{
      const type=mediaRecorder.mimeType||m||"audio/webm";
      audioBlob=new Blob(chunks,{type});
      audioPlayer.src=URL.createObjectURL(audioBlob);
      audioPlayer.style.display="block";
      audioMeta.textContent=`录音时长 ${fmtTime(seconds)} · ${fmtBytes(audioBlob.size)}`;
      discardBtn.disabled=false;
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    };

    mediaRecorder.start(250);
    seconds=0;
    timer.textContent="00:00";
    timerId=setInterval(()=>timer.textContent=fmtTime(++seconds),1000);
    startBtn.disabled=true;
    startBtn.classList.add("recording");
    startBtn.textContent="● 录音中";
    stopBtn.disabled=false;
  }catch(e){
    alert("无法使用麦克风：\n"+e.message);
  }
};

stopBtn.onclick=()=>{
  if(mediaRecorder && mediaRecorder.state!=="inactive") mediaRecorder.stop();
  clearInterval(timerId);
  startBtn.disabled=false;
  startBtn.classList.remove("recording");
  startBtn.textContent="● 开始录音";
  stopBtn.disabled=true;
};

discardBtn.onclick=()=>resetLocalAudio();

async function uploadAudio(blob){
  const ext=blob.type.includes("mp4")?"m4a":blob.type.includes("ogg")?"ogg":"webm";
  const path=`${dateInput.value}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

  const {error}=await sbClient.storage.from(AUDIO_BUCKET).upload(path,blob,{
    contentType:blob.type||"audio/webm",
    cacheControl:"3600",
    upsert:false
  });
  if(error) throw error;

  const {data}=sbClient.storage.from(AUDIO_BUCKET).getPublicUrl(path);
  return {path,url:data.publicUrl};
}

saveBtn.onclick=async()=>{
  const date=dateInput.value;
  const title=titleInput.value.trim();
  const content=contentInput.value.trim();

  if(!date) return alert("请选择日期。");
  if(!title && !content && !audioBlob) return alert("请先写一点内容或录一段音频。");

  saveBtn.disabled=true;
  uploading.style.display=audioBlob?"block":"none";

  let newAudio=null;
  try{
    const {data:oldRow,error:oldErr}=await sbClient
      .from("language_entries")
      .select("id,audio_path,audio_url,audio_name,audio_type,audio_size,duration_seconds")
      .eq("date",date)
      .maybeSingle();
    if(oldErr) throw oldErr;

    if(audioBlob) newAudio=await uploadAudio(audioBlob);

    const row={
      date,
      title,
      content,
      audio_url:newAudio ? newAudio.url : (oldRow?.audio_url || null),
      audio_path:newAudio ? newAudio.path : (oldRow?.audio_path || null),
      audio_name:newAudio ? `speaking-${date}.${audioBlob.type.includes("mp4")?"m4a":audioBlob.type.includes("ogg")?"ogg":"webm"}` : (oldRow?.audio_name || null),
      audio_type:newAudio ? audioBlob.type : (oldRow?.audio_type || null),
      audio_size:newAudio ? audioBlob.size : (oldRow?.audio_size || null),
      duration_seconds:newAudio ? seconds : (oldRow?.duration_seconds || null)
    };

    const {error}=await sbClient.from("language_entries").upsert([row],{onConflict:"date"});
    if(error) throw error;

    if(newAudio && oldRow?.audio_path && oldRow.audio_path!==newAudio.path){
      await sbClient.storage.from(AUDIO_BUCKET).remove([oldRow.audio_path]);
    }

    titleInput.value="";
    contentInput.value="";
    resetLocalAudio();
    await loadEntries();
    alert("保存成功。");
  }catch(e){
    if(newAudio?.path) await sbClient.storage.from(AUDIO_BUCKET).remove([newAudio.path]);
    alert("保存失败：\n"+e.message);
  }finally{
    uploading.style.display="none";
    saveBtn.disabled=false;
  }
};

async function loadEntries(){
  try{
    const {data,error}=await sbClient.from("language_entries").select("*").order("date",{ascending:false});
    if(error) throw error;
    statusText.textContent="✅ 已连接";
    renderEntries(data||[]);
  }catch(e){
    statusText.textContent="❌ 连接失败";
    entryList.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderEntries(items){
  if(!items.length){
    entryList.innerHTML='<div class="empty">还没有语言学习记录。</div>';
    return;
  }

  entryList.innerHTML=items.map(x=>`
    <div class="entry">
      <div class="entry-top">
        <div class="entry-title">${esc(x.title||"语言学习")}</div>
        <div class="entry-date">${esc(x.date||"")}</div>
      </div>

      ${x.content?`<div class="entry-content">${esc(x.content)}</div>`:""}

      ${x.audio_url?`
        <audio controls preload="metadata" src="${esc(x.audio_url)}"></audio>
        <div class="audio-info">
          ${x.duration_seconds!=null?`时长 ${fmtTime(Number(x.duration_seconds))}`:""}
          ${x.audio_size!=null?` · ${fmtBytes(Number(x.audio_size))}`:""}
        </div>
      `:""}

      <div class="actions">
        <button class="secondary" onclick="editEntry(${x.id})">编辑文字</button>
        ${x.content?`<button class="secondary" onclick='readSavedArticle(${JSON.stringify(x.content)})'>🔊 朗读文章</button>`:""}
        ${x.audio_url?`<a class="secondary" style="display:inline-flex;align-items:center;border-radius:999px;padding:10px 16px" href="${esc(x.audio_url)}" download="${esc(x.audio_name || ('speaking-' + (x.date || 'recording') + '.webm'))}" target="_blank" rel="noopener">下载录音</a>`:""}
        ${x.audio_path?`<button class="danger" onclick='deleteAudio(${x.id},${JSON.stringify(x.audio_path)})'>删除录音</button>`:""}
        <button class="danger" onclick="deleteEntry(${x.id})">删除整条记录</button>
      </div>
    </div>
  `).join("");
}

window.editEntry=async id=>{
  const {data,error}=await sbClient.from("language_entries").select("*").eq("id",id).single();
  if(error) return alert("读取失败：\n"+error.message);
  dateInput.value=data.date||todayLocal();
  titleInput.value=data.title||"";
  contentInput.value=data.content||"";
  resetLocalAudio();
  window.scrollTo({top:0,behavior:"smooth"});
};

window.deleteAudio=async(id,path)=>{
  if(!confirm("确定删除这段录音吗？文字记录会保留。")) return;

  const {error:storageError}=await sbClient.storage.from(AUDIO_BUCKET).remove([path]);
  if(storageError) return alert("删除录音文件失败：\n"+storageError.message);

    .from("language_entries")
    .update({

    })

window.deleteEntry=async id=>{

// ===== 总词库查看器 =====
const vocabularyModal=$("vocabularyModal"),viewVocabularyBtn=$("viewVocabularyBtn"),
closeVocabularyBtn=$("closeVocabularyBtn"),vocabularySearch=$("vocabularySearch"),
vocabularySort=$("vocabularySort"),vocabularyList=$("vocabularyList"),
vocabularySummary=$("vocabularySummary");
let VocabularyCache=[];
let VocabularyReading=false,VocabularyReadRows=[],VocabularyReadIndex=0;

function vocabularyVoice(){
  const lang=(typeof articleAccent!=="undefined" && articleAccent?.value) ? articleAccent.value : "en-US";
  const voices=speechSynthesis.getVoices();
  return {
    lang,
    voice:voices.find(v=>v.lang===lang) ||
          voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))
  };
}
window.speakVocabularyWord=word=>{
  if(!word)return;
  stopVocabularyReading(false);
  const {lang,voice}=vocabularyVoice();
  const u=new SpeechSynthesisUtterance(word);
  u.lang=lang;u.rate=.82;if(voice)u.voice=voice;
  speechSynthesis.speak(u);
};
function currentVocabularyRows(){
  let q=(vocabularySearch.value||"").trim().toLowerCase();
  let rows=VocabularyCache.filter(x=>!q ||
    (x.word||"").toLowerCase().includes(q) ||
    (x.meaning||"").toLowerCase().includes(q));
  if(vocabularySort.value==="az") rows.sort((a,b)=>(a.word||"").localeCompare(b.word||"","en"));
  if(vocabularySort.value==="wrong") rows.sort((a,b)=>(+b.wrong_count||0)-(+a.wrong_count||0));
  if(vocabularySort.value==="tested") rows.sort((a,b)=>(+b.dictation_count||0)-(+a.dictation_count||0));
  if(vocabularySort.value==="newest") rows.sort((a,b)=>(+b.id||0)-(+a.id||0));
  return rows;
}
function stopVocabularyReading(update=true){
  VocabularyReading=false;VocabularyReadRows=[];VocabularyReadIndex=0;
  speechSynthesis.cancel();
  const rb=$("readVocabularyBtn"),sb=$("stopVocabularyBtn");
  if(rb){rb.disabled=false;rb.textContent="▶ 连续朗读"}
  if(sb)sb.disabled=true;
  if(update && vocabularySummary) vocabularySummary.textContent=`总计 ${VocabularyCache.length} 个单词`;
}
function speakNextVocabulary(){
  if(!VocabularyReading || VocabularyReadIndex>=VocabularyReadRows.length){
    if(VocabularyReading) stopVocabularyReading();
    return;
  }
  const item=VocabularyReadRows[VocabularyReadIndex];
  const {lang,voice}=vocabularyVoice();
  const u=new SpeechSynthesisUtterance(item.word||"");
  u.lang=lang;u.rate=.82;if(voice)u.voice=voice;
  vocabularySummary.textContent=`连续朗读 ${VocabularyReadIndex+1} / ${VocabularyReadRows.length} · ${item.word||""}`;
  u.onend=()=>{
    if(!VocabularyReading)return;
    VocabularyReadIndex++;
    setTimeout(speakNextVocabulary,450);
  };
  u.onerror=e=>{
    if(e.error!=="canceled"&&e.error!=="interrupted"){
      VocabularyReadIndex++;
      setTimeout(speakNextVocabulary,300);
    }
  };
  speechSynthesis.speak(u);
}


async function loadVocabularyViewer(){
  vocabularyList.innerHTML='<div style="padding:20px">正在读取总词库…</div>';
  vocabularyModal.style.display="flex";
  const {data,error}=await sbClient.from("vocabulary").select("*").order("id",{ascending:false}).limit(5000);
  if(error){
    vocabularyList.innerHTML=`<div style="padding:20px">读取失败：${esc(error.message)}</div>`;
    return;
  }
  VocabularyCache=data||[];
  renderVocabularyViewer();
}
function renderVocabularyViewer(){
  let q=(vocabularySearch.value||"").trim().toLowerCase();
  let rows=VocabularyCache.filter(x=>!q ||
    (x.word||"").toLowerCase().includes(q) ||
    (x.meaning||"").toLowerCase().includes(q));
  if(vocabularySort.value==="az") rows.sort((a,b)=>(a.word||"").localeCompare(b.word||"","en"));
  if(vocabularySort.value==="wrong") rows.sort((a,b)=>(+b.wrong_count||0)-(+a.wrong_count||0));
  if(vocabularySort.value==="tested") rows.sort((a,b)=>(+b.dictation_count||0)-(+a.dictation_count||0));
  if(vocabularySort.value==="newest") rows.sort((a,b)=>(+b.id||0)-(+a.id||0));
  vocabularySummary.textContent=`总计 ${VocabularyCache.length} 个单词${q?` · 搜索到 ${rows.length} 个`:""}`;
  vocabularyList.innerHTML=rows.length?rows.map((x,i)=>`
    <div class="vocab-row">
      <div class="vocab-meta">${i+1}</div>
      <div>
        <div class="vocab-word">${esc(x.word||"")}</div>
        <div class="vocab-meta">${esc(x.added_date||"")}</div>
      </div>
      <div class="vocab-meaning">${esc(x.meaning||"—")}</div>
      <div class="vocab-meta">测试 ${+x.dictation_count||0}<br>错 ${+x.wrong_count||0}<br><button class="secondary" type="button" style="margin-top:6px;padding:6px 10px" onclick='speakVocabularyWord(${JSON.stringify(x.word||"")})'>🔊</button></div>
    </div>`).join(""):'<div style="padding:20px">没有找到匹配的单词。</div>';
}
viewVocabularyBtn.onclick=loadVocabularyViewer;
closeVocabularyBtn.onclick=()=>vocabularyModal.style.display="none";
vocabularyModal.onclick=e=>{if(e.target===vocabularyModal)vocabularyModal.style.display="none"};
vocabularySearch.oninput=renderVocabularyViewer;
vocabularySort.onchange=renderVocabularyViewer;
$("readVocabularyBtn").onclick=()=>{
  speechSynthesis.cancel();
  VocabularyReadRows=currentVocabularyRows();
  if(!VocabularyReadRows.length)return alert("当前没有可朗读的单词。");
  VocabularyReading=true;VocabularyReadIndex=0;
  $("readVocabularyBtn").disabled=true;
  $("readVocabularyBtn").textContent="▶ 朗读中";
  $("stopVocabularyBtn").disabled=false;
  speakNextVocabulary();
};
$("stopVocabularyBtn").onclick=()=>stopVocabularyReading();


// ===== 英文文章朗读 =====
const readArticleBtn=$("readArticleBtn"),pauseArticleBtn=$("pauseArticleBtn"),
resumeArticleBtn=$("resumeArticleBtn"),stopArticleBtn=$("stopArticleBtn"),
articleAccent=$("articleAccent"),articleRate=$("articleRate"),readerStatus=$("readerStatus");

let articleQueue=[],articleQueueIndex=0,articleReading=false,articlePaused=false;

function stopArticleReading(){
  speechSynthesis.cancel();
  articleQueue=[]; articleQueueIndex=0; articleReading=false; articlePaused=false;
  readArticleBtn.classList.remove("reading-active");
  readArticleBtn.textContent="🔊 朗读文章";
  pauseArticleBtn.disabled=true; resumeArticleBtn.disabled=true; stopArticleBtn.disabled=true;
  readerStatus.textContent="朗读已停止。";
}

function splitArticle(text){
  const clean=(text||"").replace(/\s+/g," ").trim();
  if(!clean) return [];
  const sentences=clean.match(/[^.!?。！？]+[.!?。！？]?/g)||[clean];
  const chunks=[]; let buf="";
  for(const s of sentences){
    if((buf+" "+s).length>220 && buf){chunks.push(buf.trim());buf=s;}
    else buf+=(buf?" ":"")+s;
  }
  if(buf) chunks.push(buf.trim());
  return chunks;
}

function speakNextArticleChunk(){
  if(!articleReading || articleQueueIndex>=articleQueue.length){
    if(articleReading){
      articleReading=false;articlePaused=false;
      readArticleBtn.classList.remove("reading-active");
      readArticleBtn.textContent="🔊 重新朗读";
      pauseArticleBtn.disabled=true;resumeArticleBtn.disabled=true;stopArticleBtn.disabled=true;
      readerStatus.textContent="✓ 文章朗读完成。";
    }
    return;
  }
  const u=new SpeechSynthesisUtterance(articleQueue[articleQueueIndex]);
  u.lang=articleAccent.value;
  u.rate=Number(articleRate.value)||1;
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>v.lang===articleAccent.value) ||
                  voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(articleAccent.value.slice(0,2).toLowerCase()));
  if(preferred) u.voice=preferred;
  u.onend=()=>{ if(articleReading && !articlePaused){articleQueueIndex++;speakNextArticleChunk();} };
  u.onerror=e=>{ if(e.error!=="canceled" && e.error!=="interrupted") readerStatus.textContent="朗读出现问题："+e.error; };
  readerStatus.textContent=`正在朗读 ${articleQueueIndex+1} / ${articleQueue.length} · ${articleAccent.value==="en-GB"?"英音":"美音"} · ${articleRate.value}×`;
  speechSynthesis.speak(u);
}

function startArticleReading(text){
  const chunks=splitArticle(text);
  if(!chunks.length){alert("请先在“学习内容”里粘贴英文文章。");return;}
  speechSynthesis.cancel();
  articleQueue=chunks;articleQueueIndex=0;articleReading=true;articlePaused=false;
  readArticleBtn.classList.add("reading-active");readArticleBtn.textContent="🔊 朗读中";
  pauseArticleBtn.disabled=false;resumeArticleBtn.disabled=true;stopArticleBtn.disabled=false;
  setTimeout(speakNextArticleChunk,80);
}

readArticleBtn.onclick=()=>startArticleReading(contentInput.value);
pauseArticleBtn.onclick=()=>{
  if(!articleReading||speechSynthesis.paused)return;
  speechSynthesis.pause();articlePaused=true;
  pauseArticleBtn.disabled=true;resumeArticleBtn.disabled=false;
  readerStatus.textContent="⏸ 已暂停。";
};
resumeArticleBtn.onclick=()=>{
  if(!articleReading)return;
  speechSynthesis.resume();articlePaused=false;
  pauseArticleBtn.disabled=false;resumeArticleBtn.disabled=true;
  readerStatus.textContent="▶ 继续朗读。";
};
stopArticleBtn.onclick=stopArticleReading;

articleAccent.onchange=()=>{
  if(articleReading){speechSynthesis.cancel();articlePaused=false;setTimeout(speakNextArticleChunk,80);}
};
articleRate.onchange=()=>{
  if(articleReading){speechSynthesis.cancel();articlePaused=false;setTimeout(speakNextArticleChunk,80);}
};

window.readSavedArticle=text=>{
  startArticleReading(text);
  window.scrollTo({top:0,behavior:"smooth"});
};

window.addEventListener("beforeunload",()=>speechSynthesis.cancel());

// ===== Supabase 永久总词库 / 双向测试 =====
const WF=$("wordFileInput"),UW=$("uploadWordsBtn"),RW=$("refreshWordsBtn"),WC=$("wordCount"),US=$("uploadWordStatus"),
QT=$("questionType"),DM=$("dictationMode"),DC=$("drawCount"),SD=$("startDictationBtn"),DA=$("dictationArea"),
DP=$("dictationProgress"),DS=$("dictationScore"),DI=$("dictationInput"),DF=$("dictationFeedback"),
QP=$("questionPrompt"),AQ=$("audioQuestionBox"),ST=$("statTotal"),SN=$("statDone"),
SC=$("statCorrect"),SA=$("statAccuracy"),WL=$("wrongList");

let DWords=[],DIndex=0,Correct=0,Wrongs=[],Answered=false,Results=[],SessionSaved=false,CurrentType="audio";

function parseWords(raw){
 const m=new Map();
 raw.replace(/^\uFEFF/,"").split(/\r?\n/).forEach(line=>{
  line=line.trim();if(!line||/^word\s*[,，\t]/i.test(line))return;
  let p=line.split(/\t|,|，/);if(p.length<2)p=line.split(/\s+-\s+|\s+—\s+/);
  const word=(p.shift()||"").trim(),meaning=p.join("，").trim();
  if(word&&/^[A-Za-z][A-Za-z' -]*$/.test(word))m.set(word.toLowerCase(),{word,meaning});
 });return [...m.values()];
}
async function refreshCount(){
 const {count,error}=await sbClient.from("vocabulary").select("*",{count:"exact",head:true});
 WC.textContent=error?"词库读取失败":`总词库 ${count||0}`;
}
RW.onclick=refreshCount;
UW.onclick=async()=>{
 const f=WF.files?.[0];if(!f)return alert("请先选择 TXT 或 CSV 单词表。");
 const words=parseWords(await f.text());if(!words.length)return alert("没有识别到单词。推荐：derive, 推导；得到");
 UW.disabled=true;US.textContent=`正在处理 ${words.length} 个单词…`;
 try{
  const keys=words.map(x=>x.word.toLowerCase());
  const {data:old,error:rerr}=await sbClient.from("vocabulary").select("word_lower").in("word_lower",keys);
  if(rerr)throw rerr;const existed=new Set((old||[]).map(x=>x.word_lower));
  const rows=words.map(x=>({word:x.word,word_lower:x.word.toLowerCase(),meaning:x.meaning,added_date:dateInput.value||todayLocal()}));
  const {error}=await sbClient.from("vocabulary").upsert(rows,{onConflict:"word_lower"});if(error)throw error;
  const added=rows.filter(x=>!existed.has(x.word_lower)).length;
  US.textContent=`✓ 本次 ${rows.length} 词：新增 ${added}，重复/更新 ${rows.length-added}`;WF.value="";await refreshCount();
 }catch(e){US.textContent="上传失败："+e.message;alert("上传失败：\n"+e.message)}finally{UW.disabled=false}
};

function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cur(){return DWords[DIndex]}
function chooseType(){
 if(QT.value!=="mixed")return QT.value;
 return ["audio","meaning_word","word_meaning"][Math.floor(Math.random()*3)];
}
function speak(){
 if(!cur()||CurrentType!=="audio")return;
 speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur().word);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u);
}
function renderQuestion(){
 if(!cur())return;
 CurrentType=chooseType();DF.textContent="";DI.value="";
 if(CurrentType==="audio"){
  QP.textContent="听发音，写出单词";AQ.style.display="block";DI.placeholder="输入英文单词，按 Enter 提交";setTimeout(speak,220);
 }else if(CurrentType==="meaning_word"){
  QP.textContent=cur().meaning||"（该词暂无中文释义）";AQ.style.display="none";DI.placeholder="根据意思写出英文单词，按 Enter 提交";
 }else{
  QP.textContent=cur().word;AQ.style.display="none";DI.placeholder="写出中文意思，按 Enter 提交";
 }
 DI.focus();
}
function updateD(){
 let done=Results.length,total=DWords.length;DP.textContent=total?`${Math.min(DIndex+1,total)} / ${total}`:"0 / 0";
 DS.textContent=`正确 ${Correct} · 错误 ${Wrongs.length}`;ST.textContent=total;SN.textContent=done;SC.textContent=Correct;
 SA.textContent=done?Math.round(Correct/done*100)+"%":"0%";
 WL.innerHTML=Wrongs.length?"<b>本次错词：</b> "+Wrongs.map(x=>esc(x.word)).join("、"):"";
}
async function pool(){
 let q=sbClient.from("vocabulary").select("*"),mode=DM.value;
 if(mode==="today")q=q.eq("added_date",dateInput.value||todayLocal());
 if(mode==="wrong")q=q.gt("wrong_count",0).order("wrong_count",{ascending:false});
 if(mode==="smart")q=q.order("wrong_count",{ascending:false}).order("last_tested_at",{ascending:true,nullsFirst:true});
 const {data,error}=await q.limit(1000);if(error)throw error;let p=data||[];
 if(mode==="random"||mode==="today")p=shuffle(p);
 if(mode==="smart")p=p.map(x=>({x,s:(+x.wrong_count||0)*3-(+x.correct_count||0)*.15+Math.random()*2})).sort((a,b)=>b.s-a.s).map(o=>o.x);
 return p.slice(0,Math.max(1,parseInt(DC.value)||50));
}
function normalizeMeaning(s){
 return (s||"").toLowerCase().replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g,"").replace(/[。.!！?？]/g,"");
}
function meaningParts(s){
 return normalizeMeaning(s).split(/[;,；，、/|]/).map(x=>x.trim()).filter(x=>x.length>=1);
}
function checkMeaningAnswer(typed,answer){
 const t=normalizeMeaning(typed);if(!t)return false;
 const expected=meaningParts(answer),given=meaningParts(typed);
 if(!expected.length)return false;
 // 任一有效释义互相包含即可，避免要求标点/顺序完全一致。
 return given.some(g=>expected.some(e=>g===e || (g.length>=2&&e.includes(g)) || (e.length>=2&&g.includes(e))));
}
SD.onclick=async()=>{
 try{
  SD.disabled=true;DWords=await pool();if(!DWords.length)return alert("这个范围下暂无可测试单词。");
  DIndex=0;Correct=0;Wrongs=[];Results=[];Answered=false;SessionSaved=false;DA.style.display="block";updateD();renderQuestion();
 }catch(e){alert("读取词库失败：\n"+e.message)}finally{SD.disabled=false}
};
$("speakWordBtn").onclick=speak;$("replayBtn").onclick=()=>{if(CurrentType==="audio")speak();else renderQuestion()};
async function answer(forceWrong=false){
 if(Answered||!cur())return;let typed=DI.value.trim();if(!typed&&!forceWrong)return;
 Answered=true;let ok=false;
 if(!forceWrong){
  if(CurrentType==="word_meaning")ok=checkMeaningAnswer(typed,cur().meaning);
  else ok=typed.toLowerCase()===cur().word.trim().toLowerCase();
 }
 if(ok){Correct++;DF.textContent="✓ 正确"}
 else{Wrongs.push(cur());DF.textContent=`✗ 正确答案：${CurrentType==="word_meaning"?(cur().meaning||"暂无释义"):cur().word}${CurrentType!=="word_meaning"&&cur().meaning?" · "+cur().meaning:""}`}
 const {error}=await sbClient.rpc("record_dictation_result",{p_word_id:cur().id,p_correct:ok,p_question_type:CurrentType});
 if(error)console.error("统计更新失败",error);
 Results.push({id:cur().id,ok,type:CurrentType});updateD();
}
async function finish(){
 if(SessionSaved)return;SessionSaved=true;let total=Results.length;
 const {error}=await sbClient.from("dictation_sessions").insert([{
  session_date:dateInput.value||todayLocal(),mode:DM.value,question_type:QT.value,total_words:total,correct_words:Correct,wrong_words:Wrongs.length
 }]);if(error)console.error("场次保存失败",error);
 DF.textContent=`测试完成：${Correct}/${total}，正确率 ${total?Math.round(Correct/total*100):0}%`;
}
async function next(){
 if(!Answered){await answer();return}
 if(DIndex>=DWords.length-1){await finish();return}
 DIndex++;Answered=false;updateD();renderQuestion();
}
DI.onkeydown=async e=>{if(e.key==="Enter"){e.preventDefault();Answered?await next():await answer()}};
$("showAnswerBtn").onclick=async()=>{
 if(!cur())return;if(!Answered)await answer(true);
 DF.textContent=`答案：${cur().word}${cur().meaning?" · "+cur().meaning:""}`;
};
$("nextWordBtn").onclick=next;
refreshCount();

loadEntries();
</script>

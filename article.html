<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>文章 - ZUMIN</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <style>
        body {
            max-width: 800px;
            margin: 80px auto;
            padding: 0 20px;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #222;
            background: #fff;
            line-height: 1.8;
        }

        a {
            color: #222;
            text-decoration: none;
        }

        .back {
            display: inline-block;
            margin-bottom: 50px;
            color: #888;
        }

        .back:hover {
            color: #222;
        }

        h1 {
            font-size: 40px;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .category {
            color: #999;
            font-size: 14px;
            margin-bottom: 50px;
        }

        .content {
            font-size: 17px;
        }

        .content h1 {
            font-size: 32px;
            margin-top: 50px;
        }

        .content h2 {
            font-size: 26px;
            margin-top: 40px;
        }

        .content h3 {
            font-size: 22px;
            margin-top: 30px;
        }

        .content blockquote {
            margin: 20px 0;
            padding: 10px 20px;
            border-left: 3px solid #ddd;
            color: #777;
            background: #fafafa;
        }

        .content code {
            padding: 2px 5px;
            background: #f5f5f5;
            border-radius: 3px;
            font-family: Consolas, monospace;
        }

        .content pre {
            padding: 20px;
            overflow-x: auto;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .content img {
            max-width: 100%;
            height: auto;
        }

        .content a {
            text-decoration: underline;
        }

        .loading {
            color: #999;
        }

        .error {
            color: #c00;
        }
    </style>
</head>

<body>

    <a class="back" href="life.html">
        ← 返回日常
    </a>

    <h1 id="title">
        正在加载……
    </h1>

    <div class="category" id="category"></div>

    <div class="content" id="content">
        <p class="loading">
            正在加载文章……
        </p>
    </div>

    <script>

        const SUPABASE_URL =
            "https://kgmhpsoiqnjszkrknqki.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_JWBaBcQORvM6wsqoA7ivzQ_GhCA3hv1";


        const params =
            new URLSearchParams(window.location.search);

        const articleId =
            params.get("id");


        const titleElement =
            document.getElementById("title");

        const categoryElement =
            document.getElementById("category");

        const contentElement =
            document.getElementById("content");


        if (!articleId) {

            titleElement.textContent =
                "找不到文章";

            contentElement.innerHTML = `
                <p class="error">
                    没有提供文章 ID。
                </p>
            `;

        } else {

            loadArticle();

        }


        async function loadArticle() {

            try {

                const url =
                    SUPABASE_URL +
                    "/rest/v1/articles" +
                    "?id=eq." +
                    encodeURIComponent(articleId) +
                    "&select=id,title,content,category";


                const response =
                    await fetch(url, {

                        method: "GET",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " + SUPABASE_KEY

                        }

                    });


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Supabase 错误：",
                        errorText
                    );

                    throw new Error(
                        "数据库请求失败"
                    );
                }


                const articles =
                    await response.json();


                if (articles.length === 0) {

                    titleElement.textContent =
                        "文章不存在";

                    contentElement.innerHTML = `
                        <p class="error">
                            找不到这篇文章。
                        </p>
                    `;

                    return;
                }


                const article =
                    articles[0];


                titleElement.textContent =
                    article.title;


                categoryElement.textContent =
                    article.category;


                const markdown =
                    article.content || "";


                const html =
                    marked.parse(markdown);


                contentElement.innerHTML =
                    DOMPurify.sanitize(html);


                document.title =
                    article.title + " - ZUMIN";

            }


            catch (error) {

                console.error(
                    "加载文章失败：",
                    error
                );

                titleElement.textContent =
                    "加载失败";

                contentElement.innerHTML = `

                    <p class="error">
                        文章加载失败。
                    </p>

                    <p>
                        请打开浏览器控制台查看错误信息。
                    </p>

                `;
            }

        }

    </script>

</body>

</html>
